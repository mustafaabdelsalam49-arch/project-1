<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="preload" href="css/style.css" as="style">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background-color: #f8f9fa;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 20px;
    }
    .error-message {
      font-size: 1.5rem;
      color: var(--color-text-dark);
      margin-bottom: 15px;
      font-family: var(--font-heading);
    }
    .error-message-en {
      font-size: 1.25rem;
      color: var(--color-text-light);
      margin-bottom: 40px;
      direction: ltr;
    }
    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <section class="not-found-section">
    <div class="container">
      <div class="error-code">404</div>
      <h2 class="error-message">عذراً، الصفحة التي تبحث عنها غير موجودة.</h2>
      <p class="error-message-en">Sorry, the page you are looking for does not exist.</p>
      
      <div class="action-buttons">
        <a href="index.html" class="btn-primary">
          العودة للرئيسية
        </a>
        <a href="index-en.html" class="btn-secondary" style="direction: ltr;">
          Back to Home
        </a>
      </div>
    </div>
  </section>
</body>
</html>
